<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>

    <div class="wrapper">
        <section class="screen" aria-live="polite" aria-atomic="true">
            0
        </section>

        <section class="calc-buttons" role="group" aria-label="Calculator keys">
            <div class="calc-button-row">
                <button class="calc-button function" data-value="AC" aria-label="All Clear">AC</button>
                <button class="calc-button function" data-value="±" aria-label="Toggle Sign">±</button>
                <button class="calc-button function" data-value="%" aria-label="Percent">%</button>
                <button class="calc-button operator" data-value="÷" aria-label="Divide">÷</button>
            </div>
            <div class="calc-button-row">
                <button class="calc-button" data-value="7">7</button>
                <button class="calc-button" data-value="8">8</button>
                <button class="calc-button" data-value="9">9</button>
                <button class="calc-button operator" data-value="×" aria-label="Multiply">×</button>
            </div>

            <div class="calc-button-row">
                <button class="calc-button" data-value="4">4</button>
                <button class="calc-button" data-value="5">5</button>
                <button class="calc-button" data-value="6">6</button>
                <button class="calc-button operator" data-value="−" aria-label="Subtract">−</button>
            </div>

            <div class="calc-button-row">
                <button class="calc-button" data-value="1">1</button>
                <button class="calc-button" data-value="2">2</button>
                <button class="calc-button" data-value="3">3</button>
                <button class="calc-button operator" data-value="+" aria-label="Add">+</button>
            </div>
            <div class="calc-button-row">
                <button class="calc-button double" data-value="0">0</button>
                <button class="calc-button" data-value=".">.</button>
                <button class="calc-button operator" data-value="=" aria-label="Equals">=</button>
            </div>
        </section>
    </div>



    <script src="script.js"></script>

</body>
</html>
